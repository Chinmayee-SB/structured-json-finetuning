# Configuration for DoRA Fine-Tuning (Weight-Decomposed Low-Rank Adaptation)
# Model: Qwen2.5-1.5B-Instruct with DoRA adapters

model: "Qwen/Qwen2.5-1.5B-Instruct"
train: true
data: "data/processed"
fine_tune_type: "dora"
optimizer: "adamw"
mask_prompt: true
num_layers: 16
batch_size: 4
grad_accumulation_steps: 2
iters: 1000
learning_rate: 1.0e-4
max_seq_length: 512
grad_checkpoint: false
lora_parameters:
  rank: 16
  scale: 32.0
  dropout: 0.05
adapter_path: "checkpoints/dora"
save_every: 200
steps_per_report: 10
steps_per_eval: 100
val_batches: 50
seed: 42
