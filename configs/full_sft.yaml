# Configuration for Full Supervised Fine-Tuning (Full SFT)
# Model: Qwen2.5-1.5B-Instruct in 16-bit precision

model: "Qwen/Qwen2.5-1.5B-Instruct"
train: true
data: "data/processed"
fine_tune_type: "full"
optimizer: "adamw"
mask_prompt: true
num_layers: -1
batch_size: 4
grad_accumulation_steps: 2
iters: 1000
learning_rate: 1.0e-5
max_seq_length: 512
grad_checkpoint: true
adapter_path: "checkpoints/full_sft"
save_every: 200
steps_per_report: 10
steps_per_eval: 100
val_batches: 50
seed: 42
